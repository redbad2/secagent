# secagent 分析质量评估数据集
#
# 每条样本包含目标、期望风险等级（含允许偏差档）、类别和说明。
# 评估器对比 agent 实际输出与 expected_risk_level 判定命中/误报/漏报。
#
# expected_risk_level 支持单值（精确匹配）或列表（任一命中即算正确，
# 用于标注不确定的边界样本）。
#
# 类别说明：
#   malicious      已知恶意（C2/钓鱼/木马），期望 高/严重
#   benign         已知良性（高流行度 + ICP 备案），期望 低
#   borderline     边界样本（CDN 共享 IP / 低流量新注册），用于检验误报抑制
#
# 注意：在线评估会真实调用 MCP 与 LLM，消耗配额；回放模式用 fixture 替代。
# fixture 生成：secagent eval --online --save-fixtures（写入 tests/eval/fixtures/）。
# 回放：secagent eval（读取 fixture 字段指定的文件，默认 <target>.json）。
# 数据集应随真实案例积累持续扩充。当前 23 条基线样本覆盖三类。
# 目标：恶意 ≥10、良性 ≥8、边界 ≥5，达到 20+ 规模以具备统计意义。
# （当前 7/11/5，恶意样本待随真实配额积累继续补充至 ≥10）

version: 2
description: "评估数据集（23 条）：恶意7 + 良性11 + 边界5，覆盖钓鱼/木马/主流服务/共享IP边界"

samples:
